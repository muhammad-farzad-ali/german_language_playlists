<!DOCTYPE html>
<html lang="de" data-theme="night">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deutsch Lernen — Goethe A1 & A2</title>
  <meta name="description" content="German language learning videos for Goethe A1 and A2 exam preparation.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Karla:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['selector', '[data-theme="night"]'],
      theme: {
        extend: {
          colors: {
            night: {
              bg: '#0F1923',
              surface: '#1A2634',
              surfaceHover: '#223040',
              text: '#E8E2DA',
              muted: '#8B8178',
              border: '#2A3441',
            },
            day: {
              bg: '#F5F0EB',
              surface: '#FAFAF8',
              surfaceHover: '#F0EBE5',
              text: '#1A1A1A',
              muted: '#6B6560',
              border: '#D1CCC4',
            },
            accent: '#D4534A',
            ink: '#2B5C8A',
          },
          fontFamily: {
            display: ['"Libre Baskerville"', 'Georgia', 'serif'],
            body: ['"Karla"', 'system-ui', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
          },
        },
      },
    }
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body class="font-body antialiased transition-colors duration-300">

  <a href="#main-content" class="skip-link">Skip to content</a>

  <header class="header">
    <div class="max-w-5xl mx-auto px-5 py-5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-accent font-display font-bold text-xl tracking-tight">DL</span>
        <span class="text-sm font-mono tracking-widest uppercase opacity-60">Deutsch Lernen</span>
      </div>
      <button id="theme-toggle" type="button" class="theme-toggle" aria-label="Toggle day/night mode">
        <svg id="icon-moon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
        <svg id="icon-sun" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="main-content">
    <section class="hero">
      <div class="max-w-5xl mx-auto px-5 py-16 md:py-24 text-center">
        <h1 class="font-display text-4xl md:text-5xl lg:text-6xl font-bold leading-tight mb-4">
          Deutsch lernen.
        </h1>
        <p class="text-lg md:text-xl opacity-70 max-w-xl mx-auto leading-relaxed">
          Schritt für Schritt — Goethe A1 & A2 Prüfungsvorbereitung mit Videolektionen.
        </p>
      </div>
    </section>

    <section class="max-w-5xl mx-auto px-5 pb-16 md:pb-24">
      <div id="playlists-container" class="space-y-4">
        <div class="text-center py-12 opacity-50">
          <p class="font-mono text-sm">Lade Playlists...</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="border-t py-8 text-center opacity-50">
    <div class="max-w-5xl mx-auto px-5">
      <p class="text-xs font-mono tracking-wide">Goethe-Institut Prüfungsvorbereitung &middot; A1 & A2</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
